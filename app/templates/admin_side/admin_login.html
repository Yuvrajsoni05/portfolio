<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YS Animated Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:#090014;
}

/* ================= BACKGROUND ================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(to top,#140028 10%,#35106a 50%,#7b3ea7 100%);
}

/* stars */

.stars{
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:60px 60px;
    opacity:0.4;
    animation:starsMove 100s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(1000px);
    }
}

/* moon */

.moon{
    position:absolute;
    top:80px;
    right:20%;
    width:120px;
    height:120px;
    border-radius:50%;
    background:linear-gradient(to bottom,#ffd7a8,#ff9f68);
    box-shadow:0 0 80px #ffb780;
    animation:moonFloat 6s ease-in-out infinite;
}

@keyframes moonFloat{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-20px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* glowing sun */

.glow{
    position:absolute;
    bottom:180px;
    left:50%;
    transform:translateX(-50%);
    width:500px;
    height:250px;
    background:radial-gradient(circle,#ffca85 0%, rgba(255,202,133,0) 70%);
    filter:blur(20px);
    animation:pulse 5s infinite;
}

@keyframes pulse{
    0%{
        transform:translateX(-50%) scale(1);
    }
    50%{
        transform:translateX(-50%) scale(1.1);
    }
    100%{
        transform:translateX(-50%) scale(1);
    }
}

/* mountains */

.mountain{
    position:absolute;
    bottom:0;
    width:100%;
}

.m1{
    height:320px;
    background:#1d0842;
    clip-path:polygon(
    0 100%,
    10% 65%,
    20% 100%,
    35% 45%,
    50% 100%,
    65% 35%,
    80% 100%,
    90% 55%,
    100% 100%
    );

    animation:mountainMove 12s ease-in-out infinite alternate;
}

.m2{
    height:260px;
    background:#2c0d5d;

    clip-path:polygon(
    0 100%,
    15% 40%,
    30% 100%,
    45% 20%,
    60% 100%,
    75% 50%,
    100% 100%
    );

    opacity:0.8;
    animation:mountainMove2 10s ease-in-out infinite alternate;
}

@keyframes mountainMove{
    from{
        transform:translateX(-20px);
    }
    to{
        transform:translateX(20px);
    }
}

@keyframes mountainMove2{
    from{
        transform:translateX(20px);
    }
    to{
        transform:translateX(-20px);
    }
}

/* ================= LOGIN ================= */

.login-container{
    position:absolute;
    top:50%;
    left:8%;
    transform:translateY(-50%);
    z-index:100;
    width:420px;
}

/* glass card */

.login-card{

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(20px);

    border-radius:30px;

    padding:45px;

    box-shadow:0 10px 40px rgba(0,0,0,0.5);

    animation:cardEnter 1.2s ease;
}

@keyframes cardEnter{

    from{
        opacity:0;
        transform:translateX(-100px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* logo */

.logo{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:20px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:700;

    color:white;

    background:linear-gradient(135deg,#ff9f68,#ff5ea8);

    box-shadow:0 0 40px rgba(255,94,168,0.7);

    animation:logoSpin 6s infinite ease-in-out;
}

@keyframes logoSpin{

    0%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(10deg) scale(1.05);
    }

    100%{
        transform:rotate(0deg);
    }
}

.title{
    color:white;
    font-size:34px;
    font-weight:700;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#ddd;
    margin-bottom:30px;
}

/* inputs */

.input-box{
    position:relative;
    margin-bottom:22px;
}

.input-box i{

    position:absolute;
    left:18px;
    top:18px;

    color:#ddd;
}

.input-box input{

    width:100%;
    height:58px;

    border:none;

    outline:none;

    border-radius:15px;

    padding-left:50px;

    background:rgba(255,255,255,0.09);

    color:white;

    border:1px solid rgba(255,255,255,0.15);

    transition:0.4s;
}

.input-box input:focus{

    border-color:#ff9f68;

    transform:scale(1.02);

    box-shadow:0 0 20px rgba(255,159,104,0.4);
}

.input-box input::placeholder{
    color:#ddd;
}

/* options */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.options label{
    color:#ddd;
    font-size:14px;
}

.options a{
    color:#ffb380;
    text-decoration:none;
    font-size:14px;
}

/* button */

.login-btn{

    width:100%;
    height:58px;

    border:none;

    border-radius:15px;

    background:linear-gradient(135deg,#ff9f68,#ff5ea8);

    color:white;

    font-size:18px;
    font-weight:600;

    transition:0.4s;
}

.login-btn:hover{

    transform:translateY(-4px);

    box-shadow:0 10px 25px rgba(255,94,168,0.4);
}

/* register */

.register{

    text-align:center;
    margin-top:25px;
    color:#ddd;
}

.register a{

    color:#ffb380;
    text-decoration:none;
    font-weight:600;
}

/* responsive */

@media(max-width:991px){

    .login-container{
        left:50%;
        transform:translate(-50%,-50%);
        width:90%;
        max-width:420px;
    }

    .moon{
        right:10%;
    }
}

@media(max-width:576px){

    .login-card{
        padding:30px;
    }

    .title{
        font-size:28px;
    }

    .logo{
        width:75px;
        height:75px;
        font-size:28px;
    }
}

</style>
</head>
<body>

<div class="scene">

    <!-- stars -->
    <div class="stars"></div>

    <!-- moon -->
    <div class="moon"></div>

    <!-- glow -->
    <div class="glow"></div>

    <!-- mountains -->
    <div class="mountain m2"></div>
    <div class="mountain m1"></div>

    <!-- LOGIN -->

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                YS
            </div>

            <h1 class="title">
                Login
            </h1>

            <p class="subtitle">
                Welcome Back
            </p>

            <form method="post" name="login_form" action="{% url 'admin_login' %}" >
                {% csrf_token %}

                <!-- username -->

                <div class="input-box">

                    <i class="bi bi-person-fill"></i>

                    <input
                        type="text"
                        placeholder="Username"
                        name="username"
                        required
                    >

                </div>

                <!-- password -->

                <div class="input-box">

                    <i class="bi bi-lock-fill"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="password"
                        required
                    >

                </div>

                <!-- options -->

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- button -->

                <button class="login-btn">
                    Login
                </button>

            </form>

            <div class="register">
                Don't have account?
                <a href="#">
                    Register
                </a>
            </div>

        </div>

    </div>

</div>

<script>

/* 3D Mouse Movement */

const card = document.querySelector('.login-card');

document.addEventListener('mousemove', (e)=>{

    let x = (window.innerWidth / 2 - e.pageX) / 40;
    let y = (window.innerHeight / 2 - e.pageY) / 40;

    card.style.transform = `
        rotateY(${x}deg)
        rotateX(${-y}deg)
    `;
});

/* reset */

document.addEventListener('mouseleave', ()=>{

    card.style.transform = `
        rotateY(0deg)
        rotateX(0deg)
    `;
});

</script>

</body>
</html>
