<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --brand: #0f2035;
  --accent: #e84545;
  --accent2: #f5a623;
  --light-bg: #f7f8fc;
  --footer-bg: #0f2035;
  --nav-height: 68px;
}

/* ─── NAVBAR ─── */
.site-nav {
  background: #fff;
  height: var(--nav-height);
  border-bottom: 1px solid rgba(15,32,53,0.09);
  position: sticky;
  top: 0;
  z-index: 1050;
  font-family: 'DM Sans', sans-serif;
}

.site-nav .navbar-brand {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.45rem;
  color: var(--brand) !important;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-dot {
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
  margin-bottom: 2px;
}

.site-nav .nav-link {
  color: #374151 !important;
  font-weight: 400;
  font-size: 0.92rem;
  padding: 8px 14px !important;
  border-radius: 8px;
  transition: background 0.18s, color 0.18s;
  position: relative;
}

.site-nav .nav-link:hover {
  color: var(--accent) !important;
  background: rgba(232,69,69,0.06);
}

.site-nav .nav-link.active {
  color: var(--accent) !important;
  font-weight: 500;
}

.site-nav .dropdown-menu {
  border: none;
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(15,32,53,0.13);
  padding: 8px;
  min-width: 190px;
  font-size: 0.9rem;
}

.site-nav .dropdown-item {
  border-radius: 8px;
  padding: 9px 14px;
  color: #374151;
  font-size: 0.9rem;
  transition: background 0.15s;
}

.site-nav .dropdown-item:hover {
  background: rgba(232,69,69,0.07);
  color: var(--accent);
}

.site-nav .btn-nav-cta {
  background: var(--accent);
  color: #fff !important;
  font-weight: 500;
  font-size: 0.88rem;
  padding: 8px 20px;
  border-radius: 999px;
  border: none;
  transition: background 0.18s, transform 0.12s;
}

.site-nav .btn-nav-cta:hover {
  background: #c73333;
  transform: translateY(-1px);
}

.navbar-toggler {
  border: 1px solid rgba(15,32,53,0.15);
  border-radius: 8px;
  padding: 6px 10px;
  outline: none !important;
  box-shadow: none !important;
}

.navbar-toggler-icon {
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%230f2035' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2.5' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
}

/* Search bar */
.nav-search {
  position: relative;
}
.nav-search input {
  background: var(--light-bg);
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 6px 16px 6px 36px;
  font-size: 0.84rem;
  width: 160px;
  transition: width 0.3s, border-color 0.2s;
  outline: none;
}
.nav-search input:focus {
  width: 200px;
  border-color: rgba(232,69,69,0.35);
  background: #fff;
}
.nav-search .bi-search {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
  color: #9ca3af;
}

/* badge */
.nav-badge {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 999px;
  vertical-align: middle;
  margin-left: 4px;
  letter-spacing: 0.3px;
}

/* ─── HERO PLACEHOLDER ─── */
.demo-hero {
  background: linear-gradient(135deg, #0f2035 0%, #1a3a5c 100%);
  color: #fff;
  padding: 80px 0 70px;
  text-align: center;
  font-family: 'Syne', sans-serif;
}
.demo-hero h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; margin-bottom: 14px; }
.demo-hero p { font-family: 'DM Sans', sans-serif; opacity: 0.7; font-size: 1.05rem; }

/* ─── FOOTER ─── */
.site-footer {
  background: var(--footer-bg);
  color: #cdd5e0;
  font-family: 'DM Sans', sans-serif;
  padding-top: 64px;
}

.site-footer .footer-brand {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: #fff;
  letter-spacing: -0.4px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.site-footer .footer-desc {
  font-size: 0.88rem;
  line-height: 1.7;
  color: #8fa3b8;
  max-width: 280px;
}

.site-footer .footer-heading {
  font-family: 'Syne', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 18px;
}

.site-footer .footer-links {
  list-style: none;
  padding: 0;
  margin: 0;
}

.site-footer .footer-links li {
  margin-bottom: 10px;
}

.site-footer .footer-links a {
  color: #8fa3b8;
  text-decoration: none;
  font-size: 0.88rem;
  transition: color 0.18s;
}

.site-footer .footer-links a:hover {
  color: var(--accent);
}

.footer-newsletter input {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px 0 0 8px;
  color: #fff;
  font-size: 0.85rem;
  padding: 10px 14px;
  outline: none;
  flex: 1;
  width: 0;
  min-width: 0;
}
.footer-newsletter input::placeholder { color: #5a7a96; }
.footer-newsletter input:focus { border-color: rgba(232,69,69,0.5); }
.footer-newsletter button {
  background: var(--accent);
  border: none;
  border-radius: 0 8px 8px 0;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 10px 18px;
  cursor: pointer;
  transition: background 0.18s;
  white-space: nowrap;
}
.footer-newsletter button:hover { background: #c73333; }

.footer-socials a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  color: #8fa3b8;
  font-size: 15px;
  text-decoration: none;
  margin-right: 8px;
  margin-top: 16px;
  transition: background 0.18s, color 0.18s;
}
.footer-socials a:hover {
  background: var(--accent);
  color: #fff;
}

.footer-divider {
  border-top: 1px solid rgba(255,255,255,0.07);
  margin-top: 52px;
}

.footer-bottom {
  padding: 20px 0;
  font-size: 0.82rem;
  color: #4e6a84;
}

.footer-bottom-links a {
  color: #4e6a84;
  text-decoration: none;
  margin-left: 20px;
  transition: color 0.15s;
}
.footer-bottom-links a:hover { color: #fff; }
</style>
</head>
<body>
{% include  'admin_side/base/navbar.html'   %}

{% block main_block %}


{% endblock main_block %}

{% include  'admin_side/base/footer.html'   %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
