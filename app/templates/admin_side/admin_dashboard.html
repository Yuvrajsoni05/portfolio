{% extends "admin_side/base/base.html" %}
{% block main_block %}
<!-- ── ADD FORM ── -->
<div class="container py-4">
  <div class="card mb-4">
    <div class="card-header d-flex align-items-center gap-2">
      <i class="bi bi-plus-circle text-danger"></i>
      <span class="section-title mb-0">Add New Entry</span>
    </div>
    <div class="card-body p-4">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label class="form-label">Title</label>
          <input type="text" id="inp-title" class="form-control" placeholder="Enter title…" maxlength="100">
          <div class="form-text text-muted" style="font-size:0.75rem;">Max 100 characters</div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Content</label>
          <textarea id="inp-content" class="form-control" rows="2" placeholder="Enter content…"></textarea>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end gap-2">
          <button class="btn-add btn w-100" onclick="addRow()"><i class="bi bi-plus me-1"></i>Add</button>
          <button class="btn-reset btn" onclick="resetForm()" title="Reset"><i class="bi bi-x"></i></button>
        </div>
      </div>
      <div id="form-error" class="text-danger mt-2" style="font-size:0.82rem; display:none;"></div>
    </div>
  </div>
  <!-- ── TABLE ── -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-table text-muted" style="font-size:15px;"></i>
        <span class="section-title mb-0">Records</span>
        <span id="row-count" class="badge bg-light text-secondary border" style="font-size:0.75rem; font-weight:500; border-radius:20px;">0 entries</span>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table mb-0" id="main-table">
          <thead>
            <tr>
              <th style="width:60px;">#</th>
              <th>Title</th>
              <th>Content</th>
              <th style="width:130px;">Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr id="empty-row">
              <td colspan="4" class="empty-state">
                <i class="bi bi-inbox" style="font-size:2rem; display:block; margin-bottom:8px; color:#d1d5db;"></i>
                No records yet. Add one above.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ── EDIT MODAL ── -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="d-flex align-items-center gap-2">
          <span style="background:#eff6ff; color:#2563eb; width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:14px;">
            <i class="bi bi-pencil"></i>
          </span>
          <h5 class="modal-title">Edit Record</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="edit-id">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" id="edit-title" class="form-control" maxlength="100" placeholder="Title…">
          <div class="form-text text-muted" style="font-size:0.75rem;">Max 100 characters</div>
        </div>
        <div class="mb-2">
          <label class="form-label">Content</label>
          <textarea id="edit-content" class="form-control" rows="4" placeholder="Content…"></textarea>
        </div>
        <div id="edit-error" class="text-danger mt-2" style="font-size:0.82rem; display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-reset btn" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-add btn" onclick="saveEdit()"><i class="bi bi-check2 me-1"></i>Save Changes</button>
      </div>
    </div>
  </div>
</div>
{% endblock main_block %}
